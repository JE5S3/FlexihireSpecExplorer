<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4b000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Flexihire Fleet">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.json">
  <title>Flexihire Fleet Spec Sheet Explorer</title>
  
  <style>
    :root {
      --primary-orange: #f4b000;
      --orange-hover: #d89c00;
      --bg-dark: #121212;
      --card-bg: #222222;
      --card-header: #1a1a1a;
      --text-white: #ffffff;
      --text-muted: #b0b0b0;
      --border-color: #333333;
      --danger-red: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark) !important;
      color: var(--text-white);
      margin: 0;
      padding: 24px;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--primary-orange);
      margin-bottom: 24px;
      gap: 16px;
    }

    .header-logo {
      max-height: 48px;
      width: auto;
      object-fit: contain;
    }

    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    h1 { margin: 0; font-size: 26px; color: var(--text-white); }
    h1 span { color: var(--primary-orange); }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

    .top-actions {
      display: flex;
      gap: 12px;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 24px;
    }

    /* Sidebar */
    .sidebar {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      height: fit-content;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 { 
      font-size: 16px; 
      margin-top: 0; 
      margin-bottom: 12px; 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: 8px;
      color: var(--primary-orange);
    }

    .search-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--border-color);
    }

    .search-input {
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 4px;
      outline: none;
      font-size: 13px;
    }

    .search-input:focus {
      border-color: var(--primary-orange);
    }

    .filter-list {
      overflow-y: auto;
      padding-right: 6px;
      margin-bottom: 12px;
    }

    .filter-group { margin-bottom: 8px; }
    .filter-group label { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      cursor: pointer; 
      font-size: 13px; 
      color: var(--text-white);
    }

    /* Buttons */
    .btn {
      background: var(--primary-orange);
      color: #ffffff;
      font-weight: 600;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { background: var(--orange-hover); }
    
    .btn-secondary {
      background: #333333;
      color: #ffffff;
    }
    .btn-secondary:hover { background: #444444; }

    .btn-danger {
      background: transparent;
      color: var(--danger-red);
      border: 1px solid var(--danger-red);
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-danger:hover {
      background: var(--danger-red);
      color: #ffffff;
    }

    /* Add Machine Panel Form */
    .add-panel {
      background: var(--card-bg);
      border: 1px solid var(--primary-orange);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      display: none;
    }

    .add-panel h3 {
      margin-top: 0;
      color: var(--primary-orange);
      font-size: 18px;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-group input, .form-group select {
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 4px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary-orange);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      padding: 12px 16px;
      background: var(--card-header);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .badge {
      background: var(--primary-orange);
      color: #ffffff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* Image area background forced to white */
    .card-img-container {
      height: 190px;
      background-color: #ffffff !important;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .card-img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .card-body {
      padding: 16px;
      flex-grow: 1;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: 13px;
    }
    .spec-label { color: var(--text-muted); }
    .spec-val { font-weight: 600; color: var(--text-white); }

    /* Reach Graph Section */
    .reach-container {
      margin-top: 16px;
      background: #141414;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .reach-title {
      font-size: 12px;
      font-weight: bold;
      color: var(--primary-orange);
      margin-bottom: 10px;
    }
    canvas { width: 100%; height: 180px; background: #0a0a0a; border-radius: 4px; }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .header-main { flex-direction: column; align-items: flex-start; gap: 12px; }
      .main-layout { grid-template-columns: 1fr; }
      .sidebar { max-height: none; }
      .grid { grid-template-columns: 1fr; }
      .top-actions { flex-wrap: wrap; width: 100%; }
      .top-actions button { width: 100%; }
      .card { width: 100%; }
    }
  </style>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("PWA Ready"))
        .catch(err => console.log(err));
    }
  </script>
</head>
<body>

  <div class="header">
    <img src="flexihire-logo.jpg" alt="Flexihire Logo" class="header-logo" onerror="this.style.display='none'">
    <div class="header-main">
      <div>
        <h1>Flexihire <span>Spec Explorer</span></h1>
        <div class="subtitle">Full Fleet: Boom Lifts & Scissor Lifts with Reach Graphs</div>
      </div>
      <div class="top-actions">
        <div id="admin-add-btn-container"></div>
        <button class="btn btn-secondary" onclick="exportFleet()">Export Fleet</button>
        <button class="btn btn-secondary" onclick="document.getElementById('fleet-import').click()">Import Fleet</button>
        <input type="file" id="fleet-import" accept=".json" style="display:none" onchange="importFleet(event)">
      </div>
    </div>
  </div>

  <!-- Add Machine Panel -->
  <div class="add-panel" id="add-panel">
    <h3>Add / Edit Machine Specification Sheet</h3>
    <form id="add-machine-form" onsubmit="handleAddMachine(event)">
      <div class="form-grid">
        <div class="form-group">
          <label>Machine Name *</label>
          <input type="text" id="new-name" placeholder="e.g. Genie Z-34/22 N" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="new-category" onchange="toggleBoomFields()">
            <option value="Boomlift EWP">Boomlift EWP</option>
            <option value="Scissor Lift">Scissor Lift</option>
            <option value="Earthmoving">Earthmoving</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Operating Weight *</label>
          <input type="text" id="new-weight" placeholder="e.g. 5,216 kg" required>
        </div>
        <div class="form-group">
          <label>Dimensions (L x W x H) *</label>
          <input type="text" id="new-dimensions" placeholder="e.g. 5.72m x 1.47m x 2.00m" required>
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>Local Image Path</label>
          <input type="text" id="new-image" placeholder="Leave blank to use images/<machine-id>.jpg">
        </div>
      </div>

      <!-- Boomlift specific fields -->
      <div id="boom-fields" style="margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border-color);">
        <div class="form-grid">
          <div class="form-group">
            <label>Max Platform Height (m)</label>
            <input type="number" id="new-height" step="0.1" placeholder="10.5">
          </div>
          <div class="form-group">
            <label>Max Horizontal Reach (m)</label>
            <input type="number" id="new-reach" step="0.1" placeholder="6.8">
          </div>
          <div class="form-group">
            <label>Up & Over Clearance (m)</label>
            <input type="number" id="new-upover" step="0.1" placeholder="4.6">
          </div>
        </div>
      </div>

      <div style="margin-top: 16px; display: flex; gap: 10px;">
        <button type="submit" class="btn">Save Machine</button>
        <button type="button" class="btn btn-secondary" onclick="toggleAddPanel()">Cancel</button>
      </div>
    </form>
  </div>

  <div class="main-layout">
    <!-- Sidebar Controls -->
    <div class="sidebar">
      <h2>Filter Fleet</h2>
      
      <!-- Search & Height Filters -->
      <div class="search-section">
        <input type="text" id="search-query" class="search-input" placeholder="🔍 Search machine name..." oninput="renderCards()">
        <input type="number" id="min-height-filter" class="search-input" placeholder="📏 Min Platform Height (m)" step="0.5" oninput="renderCards()">
      </div>

      <div class="filter-list" id="checkbox-container">
        <!-- Checkboxes injected here -->
      </div>
      <button class="btn" style="width:100%; margin-top: auto;" onclick="selectAll(true)">Select All</button>
      <button class="btn btn-secondary" style="width:100%; margin-top:6px;" onclick="sortFleet()">Sort A-Z</button>
      <button class="btn btn-secondary" style="width:100%; margin-top:6px;" onclick="selectAll(false)">Clear Selection</button>
    </div>

    <!-- Main Cards Grid -->
    <div class="grid" id="machine-grid">
      <!-- Cards injected here -->
    </div>
  </div>

  <script>
    let adminConfig = {
      isAdmin: false,
      allowEdit: false,
      allowRemove: false,
      allowAdd: false
    };

    // Default Fallback Fleet Data
    let fleetData = [
      {
        id: 'z34_genie',
        name: '34ft Genie Z-34/22 IC Boom',
        category: 'Boomlift EWP',
        weight: '4,944 kg',
        dimensions: '5.64m (L) x 1.73m (W) x 2.00m (H)',
        image: '',
        isBoomlift: true,
        maxHeight: 12.5,
        maxReach: 6.8,
        upAndOver: 4.6
      },
      {
        id: 'sj3219_skyjack',
        name: '19ft Skyjack SJ3219 Scissor',
        category: 'Scissor Lift',
        weight: '1,312 kg',
        dimensions: '1.78m (L) x 0.81m (W) x 2.11m (H)',
        image: '',
        isBoomlift: false,
        maxHeight: 5.8
      }
    ];

    let selectedIds = new Set();
    let editingId = null;

    // Load fleet.json automatically on startup with cache-busting
    async function loadFleetJson() {
      try {
        const response = await fetch('fleet.json?t=' + Date.now(), { cache: 'no-store' });
        if (response.ok) {
          fleetData = await response.json();
        }
      } catch (err) {
        console.warn('fleet.json not found directly next to index.html. Using internal fallback data.');
      }
      
      // Default Sort A-Z on start
      sortFleetDataAZ();
      selectedIds = new Set(fleetData.map(m => m.id));
      initSidebar();
      renderCards();
    }

    function sortFleetDataAZ() {
      fleetData.sort((a, b) => a.name.localeCompare(b.name));
    }

    async function loadAdminConfig() {
      try {
        const res = await fetch('admin-config.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          adminConfig = await res.json();
        }
      } catch (err) {
        console.warn('admin-config.json not found. Standard view active.');
      }
      applyAdminPermissions();
    }

    function applyAdminPermissions() {
      const addContainer = document.getElementById('admin-add-btn-container');
      if (adminConfig.isAdmin && adminConfig.allowAdd) {
        addContainer.innerHTML = `<button class="btn" onclick="toggleAddPanel()">+ Add New Machine</button>`;
      } else {
        addContainer.innerHTML = '';
      }
      renderCards();
    }

    function initSidebar() {
      const container = document.getElementById('checkbox-container');
      container.innerHTML = fleetData.map(m => `
        <div class="filter-group">
          <label>
            <input type="checkbox" value="${m.id}" ${selectedIds.has(m.id) ? 'checked' : ''} onchange="toggleSelect('${m.id}')">
            ${m.name}
          </label>
        </div>
      `).join('');
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      renderCards();
    }

    function selectAll(enable) {
      if (enable) selectedIds = new Set(fleetData.map(m => m.id));
      else selectedIds.clear();
      initSidebar();
      renderCards();
    }

    function toggleAddPanel() {
      if (!adminConfig.isAdmin || !adminConfig.allowAdd) return;
      const panel = document.getElementById('add-panel');
      const isVisible = panel.style.display === 'block';
      panel.style.display = isVisible ? 'none' : 'block';
      if (isVisible) {
        editingId = null;
        document.getElementById('add-machine-form').reset();
      }
    }

    function toggleBoomFields() {
      const cat = document.getElementById('new-category').value;
      const boomFields = document.getElementById('boom-fields');
      boomFields.style.display = (cat === 'Boomlift EWP') ? 'block' : 'none';
    }

    function editMachine(id) {
      if (!adminConfig.isAdmin || !adminConfig.allowEdit) return;
      const m = fleetData.find(x => x.id === id);
      if (!m) return;
      editingId = id;
      document.getElementById("add-panel").style.display = "block";
      document.getElementById("new-name").value = m.name;
      document.getElementById("new-category").value = m.category;
      document.getElementById("new-weight").value = m.weight;
      document.getElementById("new-dimensions").value = m.dimensions;
      document.getElementById("new-image").value = m.image || "";
      if (m.isBoomlift) {
        document.getElementById("new-height").value = m.maxHeight || "";
        document.getElementById("new-reach").value = m.maxReach || "";
        document.getElementById("new-upover").value = m.upAndOver || "";
      }
      toggleBoomFields();
    }

    function handleAddMachine(e) {
      e.preventDefault();
      if (!adminConfig.isAdmin) return;
      
      const category = document.getElementById('new-category').value;
      const isBoom = (category === 'Boomlift EWP');
      const newId = editingId || ('m_' + Date.now());

      const newMachine = {
        id: newId,
        name: document.getElementById('new-name').value,
        category: category,
        weight: document.getElementById('new-weight').value,
        dimensions: document.getElementById('new-dimensions').value,
        image: document.getElementById('new-image').value,
        isBoomlift: isBoom,
        maxHeight: parseFloat(document.getElementById('new-height').value) || 0,
        maxReach: isBoom ? parseFloat(document.getElementById('new-reach').value) || 8 : 0,
        upAndOver: isBoom ? parseFloat(document.getElementById('new-upover').value) || 6 : 0
      };

      if (editingId) {
        const index = fleetData.findIndex(m => m.id === editingId);
        fleetData[index] = newMachine;
        editingId = null;
      } else {
        fleetData.push(newMachine);
      }

      sortFleetDataAZ();
      selectedIds.add(newId);
      document.getElementById('add-machine-form').reset();
      toggleAddPanel();
      initSidebar();
      renderCards();
    }

    function removeMachine(id) {
      if (!adminConfig.isAdmin || !adminConfig.allowRemove) return;
      if (confirm('Are you sure you want to remove this machine from your list?')) {
        fleetData = fleetData.filter(m => m.id !== id);
        selectedIds.delete(id);
        initSidebar();
        renderCards();
      }
    }

    function renderCards() {
      const grid = document.getElementById('machine-grid');
      const query = document.getElementById('search-query').value.toLowerCase().trim();
      const minHeight = parseFloat(document.getElementById('min-height-filter').value) || 0;

      const activeData = fleetData.filter(m => {
        const matchesSelection = selectedIds.has(m.id);
        const matchesSearch = m.name.toLowerCase().includes(query) || m.category.toLowerCase().includes(query);
        const matchesHeight = (m.maxHeight || 0) >= minHeight;
        return matchesSelection && matchesSearch && matchesHeight;
      });

      if (activeData.length === 0) {
        grid.innerHTML = '<div style="color: var(--text-muted); padding: 40px; text-align: center; grid-column: 1/-1;">No machines match your criteria. Select items from the sidebar or adjust your search filters.</div>';
        return;
      }

      const cacheBust = '?v=' + Date.now();

      grid.innerHTML = activeData.map(m => {
        let actionButtonsHtml = '';
        if (adminConfig.isAdmin) {
          if (adminConfig.allowEdit) {
            actionButtonsHtml += `<button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="editMachine('${m.id}')">✎ Edit</button>`;
          }
          if (adminConfig.allowRemove) {
            actionButtonsHtml += `<button class="btn-danger" onclick="removeMachine('${m.id}')" title="Remove machine">✕ Remove</button>`;
          }
        }

        const imgPath = (m.image || `images/${m.id}.jpg`) + cacheBust;

        return `
          <div class="card">
            <div class="card-header">
              <div>
                <span class="badge" style="margin-right:6px;">${m.category}</span>
                <span style="font-weight: bold; font-size: 14px;">${m.name}</span>
              </div>
              <div style="display:flex; gap:6px;">
                ${actionButtonsHtml}
              </div>
            </div>
            <div class="card-img-container">
              <img src="${imgPath}" alt="${m.name}" class="card-img" onerror="this.style.display='none'">
            </div>
            <div class="card-body">
              <div class="spec-row">
                <span class="spec-label">Operating Weight:</span>
                <span class="spec-val">${m.weight}</span>
              </div>
              <div class="spec-row">
                <span class="spec-label">Dimensions (L x W x H):</span>
                <span class="spec-val">${m.dimensions}</span>
              </div>

              ${m.isBoomlift ? `
                <div class="reach-container">
                  <div class="reach-title">📐 Reach Envelope Diagram</div>
                  <div class="spec-row"><span class="spec-label">Max Height:</span><span class="spec-val">${m.maxHeight}m</span></div>
                  <div class="spec-row"><span class="spec-label">Max Reach:</span><span class="spec-val">${m.maxReach}m</span></div>
                  <div class="spec-row"><span class="spec-label">Up & Over Clearance:</span><span class="spec-val">${m.upAndOver}m</span></div>
                  <canvas id="canvas-${m.id}"></canvas>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      activeData.filter(m => m.isBoomlift).forEach(drawReachGraph);
    }

    function drawReachGraph(machine) {
      const canvas = document.getElementById(`canvas-${machine.id}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.offsetWidth;
      const h = canvas.height = canvas.offsetHeight;

      ctx.clearRect(0, 0, w, h);

      const paddingLeft = 32;
      const paddingBottom = 26;
      const graphW = w - paddingLeft - 15;
      const graphH = h - paddingBottom - 15;
      const originX = paddingLeft;
      const originY = h - paddingBottom;

      const maxH = Math.ceil(machine.maxHeight || 20);
      const maxR = Math.ceil(machine.maxReach || 12);

      ctx.strokeStyle = '#282828';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#ffffff';
      ctx.font = '10px sans-serif';

      const stepX = Math.max(2, Math.floor(maxR / 5));
      ctx.textAlign = 'center';
      for (let r = 0; r <= maxR; r += stepX) {
        const x = originX + (r / maxR) * graphW;
        ctx.beginPath();
        ctx.moveTo(x, originY);
        ctx.lineTo(x, 10);
        ctx.stroke();
        ctx.fillText(`${r}m`, x, originY + 16);
      }

      const stepY = Math.max(2, Math.floor(maxH / 5));
      ctx.textAlign = 'right';
      for (let ht = 0; ht <= maxH; ht += stepY) {
        const y = originY - (ht / maxH) * graphH;
        ctx.beginPath();
        ctx.moveTo(originX, y);
        ctx.lineTo(w - 10, y);
        ctx.stroke();
        ctx.fillText(`${ht}m`, originX - 6, y + 3);
      }

      ctx.strokeStyle = '#f4b000';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(originX, 10);
      ctx.lineTo(originX, originY);
      ctx.lineTo(w - 10, originY);
      ctx.stroke();

      const scaleX = graphW / maxR;
      const scaleY = graphH / maxH;

      ctx.fillStyle = 'rgba(244, 176, 0, 0.22)';
      ctx.strokeStyle = '#f4b000';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.lineTo(originX, originY - (machine.upAndOver * scaleY));
      ctx.quadraticCurveTo(
        originX + (machine.maxReach * scaleX), 
        originY - (machine.maxHeight * scaleY), 
        originX + (machine.maxReach * scaleX * 0.85), 
        originY - (machine.maxHeight * scaleY * 0.5)
      );
      ctx.lineTo(originX, originY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function sortFleet() {
      sortFleetDataAZ();
      initSidebar();
      renderCards();
    }

    function exportFleet() {
      const data = JSON.stringify(fleetData, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'fleet.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importFleet(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          fleetData = JSON.parse(e.target.result);
          sortFleetDataAZ();
          selectedIds = new Set(fleetData.map(m => m.id));
          initSidebar();
          renderCards();
          alert('Fleet imported successfully.');
        } catch (err) {
          alert('Invalid fleet JSON file.');
        }
      };
      reader.readAsText(file);
    }

    window.addEventListener('resize', () => {
      fleetData.filter(m => m.isBoomlift && selectedIds.has(m.id)).forEach(drawReachGraph);
    });

    // Initialize App
    async function init() {
      await loadFleetJson();
      await loadAdminConfig();
    }

    init();
  </script>
</body>
</html>
