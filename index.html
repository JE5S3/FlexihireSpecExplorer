<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexihire Spec Explorer</title>
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-bg: #141414;
      --sidebar-bg: #111111;
      --border-color: #282828;
      --primary-orange: #f4b000;
      --text-main: #f0f0f0;
      --text-muted: #a0a0a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Centered Header Bar */
    #header {
      background-color: var(--sidebar-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      text-align: center;
      flex-shrink: 0;
      z-index: 10;
    }

    #header h1 {
      font-size: 18px;
      color: var(--primary-orange);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 auto;
    }

    /* App Container Layout */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: 320px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 14px;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--primary-orange);
    }

    .machine-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .category-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary-orange);
      margin: 16px 8px 8px 8px;
      font-weight: bold;
    }

    .machine-item {
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 14px;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
    }

    .machine-item:hover {
      background: rgba(244, 176, 0, 0.1);
      color: var(--text-main);
    }

    .machine-item.active {
      background: var(--primary-orange);
      color: #000;
      font-weight: 600;
    }

    /* Main Spec Content Area */
    #content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .spec-card {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
    }

    .spec-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .spec-header h2 {
      font-size: 22px;
      color: #fff;
      margin-bottom: 6px;
    }

    .spec-header .category-badge {
      display: inline-block;
      background: rgba(244, 176, 0, 0.15);
      color: var(--primary-orange);
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .spec-item {
      background: var(--bg-dark);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .spec-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .spec-item .value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Envelope Graph Container & Canvas */
    .reach-container {
      margin-top: 16px;
      background: var(--bg-dark);
      padding: 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .reach-title {
      font-size: 12px;
      font-weight: bold;
      color: var(--primary-orange);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    canvas {
      width: 100%;
      height: 240px;
      background: #050505;
      border-radius: 4px;
      display: block;
    }

    .placeholder {
      text-align: center;
      color: var(--text-muted);
      margin-top: 60px;
      font-size: 15px;
    }

    /* Mobile Responsive Overrides */
    @media (max-width: 768px) {
      body {
        height: 100vh;
      }
      .app-container {
        flex-direction: column;
        overflow-y: auto;
      }
      #sidebar {
        width: 100%;
        max-height: 250px;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }
      #content {
        padding: 16px;
        overflow-y: visible;
      }
      .spec-card {
        padding: 16px;
      }
      .spec-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

      { id: "sj9243rt_skyjack", name: "43ft Skyjack SJ9243 RT Scissor", category: "Scissor Lift", weight: "6,520 kg", dimensions: "4.47m (L) x 2.34m (W) x 2.97m (H)", isBoomlift: false, maxHeight: 15.1 },

      { id: "mhp13at_snorkel", name: "Snorkel MHP13AT Trailer Boom", category: "Trailer Mounted Boom", weight: "1,460 kg", dimensions: "4.90m (L) x 1.60m (W) x 2.00m (H)", isBoomlift: true, maxHeight: 12.9, maxReach: 6.4, upAndOver: 4.0 },
      { id: "mhp1335_snorkel", name: "Snorkel MHP13/35 Trailer Boom", category: "Trailer Mounted Boom", weight: "1,360 kg", dimensions: "5.99m (L) x 1.58m (W) x 2.05m (H)", isBoomlift: true, maxHeight: 12.6, maxReach: 5.6, upAndOver: 4.0 },
      { id: "tl38_snorkel", name: "15m Snorkel TL38 Trailer Boom", category: "Trailer Mounted Boom", weight: "1,580 kg", dimensions: "5.60m (L) x 1.60m (W) x 2.01m (H)", isBoomlift: true, maxHeight: 13.5, maxReach: 6.1, upAndOver: 4.3 },
      { id: "gr20_genie", name: "8m Genie Runabout GR-20 Manlift", category: "Manlift", weight: "1,112 kg", dimensions: "1.35m (L) x 0.80m (W) x 1.98m (H)", isBoomlift: false, maxHeight: 8.02 }
    ];

    let activeMachineId = null;

    function renderSidebar() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const listContainer = document.getElementById('machineList');
      listContainer.innerHTML = '';

      const categories = [...new Set(fleetData.map(item => item.category))];

      categories.forEach(category => {
        const items = fleetData
          .filter(item => item.category === category && item.name.toLowerCase().includes(search))
          .sort((a, b) => a.name.localeCompare(b.name));

        if (items.length > 0) {
          const catTitle = document.createElement('div');
          catTitle.className = 'category-title';
          catTitle.innerText = category;
          listContainer.appendChild(catTitle);

          items.forEach(item => {
            const div = document.createElement('div');
            div.className = `machine-item ${item.id === activeMachineId ? 'active' : ''}`;
            div.innerText = item.name;
            div.onclick = () => selectMachine(item.id);
            listContainer.appendChild(div);
          });
        }
      });
    }

    function selectMachine(id) {
      activeMachineId = id;
      renderSidebar();
      const machine = fleetData.find(item => item.id === id);
      if (!machine) return;

      const displayArea = document.getElementById('displayArea');
      displayArea.innerHTML = `
        <div class="spec-card">
          <div class="spec-header">
            <h2>${machine.name}</h2>
            <span class="category-badge">${machine.category}</span>
          </div>
          <div class="spec-grid">
            <div class="spec-item"><div class="label">Operating Weight</div><div class="value">${machine.weight || 'N/A'}</div></div>
            <div class="spec-item"><div class="label">Dimensions (LxWxH)</div><div class="value">${machine.dimensions || 'N/A'}</div></div>
            ${machine.maxHeight ? `<div class="spec-item"><div class="label">Max Working Height</div><div class="value">${machine.maxHeight} m</div></div>` : ''}
            ${machine.maxReach ? `<div class="spec-item"><div class="label">Max Horizontal Reach</div><div class="value">${machine.maxReach} m</div></div>` : ''}
            ${machine.upAndOver ? `<div class="spec-item"><div class="label">Up & Over Clearance</div><div class="value">${machine.upAndOver} m</div></div>` : ''}
          </div>
          ${machine.isBoomlift ? `
            <div class="reach-container">
              <div class="reach-title">Full Reach Envelope Boundary Diagram</div>
              <canvas id="canvas-${machine.id}"></canvas>
            </div>
          ` : ''}
        </div>
      `;

      if (machine.isBoomlift) {
        requestAnimationFrame(() => drawReachGraph(machine));
      }
    }

    function drawReachGraph(machine) {
      const canvas = document.getElementById(`canvas-${machine.id}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = 240 * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = 240;

      ctx.clearRect(0, 0, w, h);

      const paddingLeft = 40;
      const paddingBottom = 30;
      const paddingTop = 20;
      const paddingRight = 20;

      const graphW = w - paddingLeft - paddingRight;
      const graphH = h - paddingTop - paddingBottom;
      const originX = paddingLeft;
      const originY = h - paddingBottom;

      const maxH = Math.max(Math.ceil((machine.maxHeight || 20) / 5) * 5, 10);
      const maxR = Math.max(Math.ceil((machine.maxReach || 12) / 2) * 2, 6);

      const scaleX = graphW / maxR;
      const scaleY = graphH / maxH;

      ctx.strokeStyle = '#282828';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#a0a0a0';
      ctx.font = '10px sans-serif';

      const stepX = maxR > 20 ? 5 : 2;
      ctx.textAlign = 'center';
      for (let r = 0; r <= maxR; r += stepX) {
        const x = originX + r * scaleX;
        ctx.beginPath();
        ctx.moveTo(x, originY);
        ctx.lineTo(x, paddingTop);
        ctx.stroke();
        ctx.fillText(`${r}m`, x, originY + 16);
      }

      const stepY = maxH > 30 ? 10 : 5;
      ctx.textAlign = 'right';
      for (let ht = 0; ht <= maxH; ht += stepY) {
        const y = originY - ht * scaleY;
        ctx.beginPath();
        ctx.moveTo(originX, y);
        ctx.lineTo(w - paddingRight, y);
        ctx.stroke();
        ctx.fillText(`${ht}m`, originX - 6, y + 3);
      }

      ctx.strokeStyle = '#f4b000';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(originX, paddingTop);
      ctx.lineTo(originX, originY);
      ctx.lineTo(w - paddingRight, originY);
      ctx.stroke();

      const H = machine.maxHeight || 0;
      const R = machine.maxReach || 0;
      const UO = machine.upAndOver || 0;

      const p0 = { x: originX, y: originY };
      const p1 = { x: originX, y: originY - (UO * scaleY) };
      const p2 = { x: originX + (R * 0.45 * scaleX), y: originY - (H * scaleY) };
      const p3 = { x: originX + (R * scaleX), y: originY - (H * 0.65 * scaleY) };
      const p4 = { x: originX + (R * 0.7 * scaleX), y: originY - (H * 0.15 * scaleY) };

      ctx.fillStyle = 'rgba(244, 176, 0, 0.25)';
      ctx.strokeStyle = '#f4b000';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);

      ctx.quadraticCurveTo(
        originX, originY - (H * scaleY),
        p2.x, p2.y
      );

      ctx.quadraticCurveTo(
        originX + (R * scaleX), originY - (H * 0.9 * scaleY),
        p3.x, p3.y
      );

      ctx.quadraticCurveTo(
        originX + (R * scaleX), originY - (H * 0.25 * scaleY),
        p4.x, p4.y
      );

      ctx.lineTo(p0.x, p0.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      const drawMarker = (pt, label) => {
        ctx.fillStyle = '#f4b000';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(label, pt.x + 6, pt.y - 4);
      };

      drawMarker(p2, `Max H: ${H}m`);
      drawMarker(p3, `Max R: ${R}m`);
    }

    window.addEventListener('resize', () => {
      if (activeMachineId) {
        const machine = fleetData.find(item => item.id === activeMachineId);
        if (machine && machine.isBoomlift) {
          drawReachGraph(machine);
        }
      }
    });

    renderSidebar();
  </script>
</body>
</html>
