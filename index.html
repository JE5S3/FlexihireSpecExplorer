<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4b000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Flexihire Fleet">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Flexihire Fleet Spec Sheet Explorer</title>
  
  <style>
    :root {
      --primary-orange: #f4b000;
      --orange-hover: #d89c00;
      --bg-dark: #121212;
      --card-bg: #222222;
      --card-header: #1a1a1a;
      --text-white: #ffffff;
      --text-muted: #b0b0b0;
      --border-color: #333333;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark) !important;
      color: var(--text-white);
      margin: 0;
      padding: 24px;
    }

    /* Centered Header & Top-Middle Logo Alignment */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--primary-orange);
      margin-bottom: 24px;
      gap: 12px;
    }

    .header-logo {
      max-height: 52px;
      width: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .header-text {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { margin: 0; font-size: 24px; color: var(--text-white); }
    h1 span { color: var(--primary-orange); }
    .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

    .main-layout {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 24px;
    }

    /* Sidebar */
    .sidebar {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      height: fit-content;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 { 
      font-size: 16px; 
      margin-top: 0; 
      margin-bottom: 12px; 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: 8px;
      color: var(--primary-orange);
    }

    .search-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--border-color);
    }

    .search-input {
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 4px;
      outline: none;
      font-size: 13px;
    }

    .search-input:focus {
      border-color: var(--primary-orange);
    }

    .filter-list {
      overflow-y: auto;
      padding-right: 6px;
      margin-bottom: 12px;
    }

    .category-header {
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary-orange);
      margin: 12px 0 6px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .category-header:first-child {
      margin-top: 0;
    }

    .filter-group { margin-bottom: 6px; padding-left: 4px; }
    .filter-group label { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      cursor: pointer; 
      font-size: 13px; 
      color: var(--text-white);
    }

    /* Buttons */
    .btn {
      background: var(--primary-orange);
      color: #ffffff;
      font-weight: 600;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { background: var(--orange-hover); }
    
    .btn-secondary {
      background: #333333;
      color: #ffffff;
    }
    .btn-secondary:hover { background: #444444; }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      padding: 12px 16px;
      background: var(--card-header);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .badge {
      background: var(--primary-orange);
      color: #ffffff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .card-img-container {
      height: 190px;
      background-color: #ffffff !important;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .card-img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .card-body {
      padding: 16px;
      flex-grow: 1;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: 13px;
    }
    .spec-label { color: var(--text-muted); }
    .spec-val { font-weight: 600; color: var(--text-white); }

    /* Responsive High-DPI Canvas Styling */
    .reach-container {
      margin-top: 16px;
      background: #141414;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .reach-title {
      font-size: 12px;
      font-weight: bold;
      color: var(--primary-orange);
      margin-bottom: 10px;
    }
    canvas {
      width: 100%;
      height: 220px;
      background: #0a0a0a;
      border-radius: 4px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="flexihire-logo.jpg" alt="Flexihire Logo" class="header-logo" onerror="this.style.display='none'">
    <div class="header-text">
      <h1> <span>Spec Explorer</span></h1>
      <div class="subtitle">Full Fleet: Boom Lifts & Scissor Lifts with Reach Graphs</div>
    </div>
  </div>

  <div class="main-layout">
    <!-- Sidebar Controls -->
    <div class="sidebar">
      <h2>Filter Fleet</h2>
      
      <!-- Search & Height Filters -->
      <div class="search-section">
        <input type="text" id="search-query" class="search-input" placeholder="Search machine name..." oninput="renderCards()">
        <input type="number" id="min-height-filter" class="search-input" placeholder="Min Platform Height (m)" step="0.5" oninput="renderCards()">
      </div>

      <div class="filter-list" id="checkbox-container">
        <!-- Subsections and Checkboxes injected here -->
      </div>
      <button class="btn" style="width:100%; margin-top: auto;" onclick="selectAll(true)">Select All</button>
      <button class="btn btn-secondary" style="width:100%; margin-top:6px;" onclick="selectAll(false)">Clear Selection</button>
    </div>

    <!-- Main Cards Grid -->
    <div class="grid" id="machine-grid">
      <!-- Cards injected here -->
    </div>
  </div>

  <script>
    let fleetData = [];
    let selectedIds = new Set();

    // Helper: Sort fleet array A-Z by name
    function sortFleetDataAZ() {
      fleetData.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
    }

    // Always fetch directly from fleet.json (bypassing browser cache & local storage)
    async function loadFleetData() {
      try {
        const nocacheUrl = 'fleet.json?nocache=' + new Date().getTime();
        const response = await fetch(nocacheUrl, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
        });

        if (response.ok) {
          fleetData = await response.json();
        } else {
          console.error('Failed to load fleet.json');
        }
      } catch (err) {
        console.warn('Could not load fleet.json automatically.', err);
      }

      // Clear any legacy local storage cache if present
      localStorage.removeItem('flexihire_fleet_cache');

      sortFleetDataAZ();
      selectedIds = new Set(fleetData.map(m => m.id));
      initSidebar();
      renderCards();
    }

    function initSidebar() {
      const container = document.getElementById('checkbox-container');
      
      const categories = [
        { key: 'Scissor Lift', label: 'Scissor Lifts' },
        { key: 'Boomlift EWP', label: 'Boom Lifts' },
        { key: 'Trailer Boom', label: 'Trailer Booms' },
        { key: 'Other', label: 'Other Fleet' }
      ];

      let html = '';

      categories.forEach(cat => {
        const items = fleetData.filter(m => {
          if (cat.key === 'Other') {
            return !['Scissor Lift', 'Boomlift EWP', 'Trailer Boom'].includes(m.category);
          }
          return m.category === cat.key;
        });

        if (items.length > 0) {
          html += `
            <div class="category-header" onclick="toggleCategoryGroup('${cat.key}')">
              <span>${cat.label} (${items.length})</span>
              <span style="font-size:10px; opacity:0.8;">Select Category</span>
            </div>
          `;
          items.forEach(m => {
            html += `
              <div class="filter-group">
                <label>
                  <input type="checkbox" value="${m.id}" ${selectedIds.has(m.id) ? 'checked' : ''} onchange="toggleSelect('${m.id}')">
                  ${m.name}
                </label>
              </div>
            `;
          });
        }
      });

      container.innerHTML = html;
    }

    function toggleCategoryGroup(categoryKey) {
      const items = fleetData.filter(m => {
        if (categoryKey === 'Other') {
          return !['Scissor Lift', 'Boomlift EWP', 'Trailer Boom'].includes(m.category);
        }
        return m.category === categoryKey;
      });

      const allSelected = items.every(m => selectedIds.has(m.id));
      
      items.forEach(m => {
        if (allSelected) {
          selectedIds.delete(m.id);
        } else {
          selectedIds.add(m.id);
        }
      });

      initSidebar();
      renderCards();
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      renderCards();
    }

    function selectAll(enable) {
      if (enable) selectedIds = new Set(fleetData.map(m => m.id));
      else selectedIds.clear();
      initSidebar();
      renderCards();
    }

    function renderCards() {
      const grid = document.getElementById('machine-grid');
      const query = document.getElementById('search-query').value.toLowerCase().trim();
      const minHeight = parseFloat(document.getElementById('min-height-filter').value) || 0;

      const activeData = fleetData.filter(m => {
        const matchesSelection = selectedIds.has(m.id);
        const matchesSearch = m.name.toLowerCase().includes(query) || m.category.toLowerCase().includes(query);
        const matchesHeight = (m.maxHeight || 0) >= minHeight;
        return matchesSelection && matchesSearch && matchesHeight;
      });

      if (activeData.length === 0) {
        grid.innerHTML = '<div style="color: var(--text-muted); padding: 40px; text-align: center; grid-column: 1/-1;">No machines match your criteria. Select items from the sidebar or adjust your search filters.</div>';
        return;
      }

      grid.innerHTML = activeData.map(m => {
        const imgPath = m.image || `images/${m.id}.jpg`;

        return `
          <div class="card">
            <div class="card-header">
              <div>
                <span class="badge" style="margin-right:6px;">${m.category}</span>
                <span style="font-weight: bold; font-size: 14px;">${m.name}</span>
              </div>
            </div>
            <div class="card-img-container">
              <img src="${imgPath}" alt="${m.name}" class="card-img" onerror="this.style.display='none'">
            </div>
            <div class="card-body">
              <div class="spec-row">
                <span class="spec-label">Operating Weight:</span>
                <span class="spec-val">${m.weight}</span>
              </div>
              <div class="spec-row">
                <span class="spec-label">Dimensions (L x W x H):</span>
                <span class="spec-val">${m.dimensions}</span>
              </div>

              ${m.isBoomlift ? `
                <div class="reach-container">
                  <div class="reach-title">Reach Envelope Diagram</div>
                  <div class="spec-row"><span class="spec-label">Max Height:</span><span class="spec-val">${m.maxHeight}m</span></div>
                  <div class="spec-row"><span class="spec-label">Max Reach:</span><span class="spec-val">${m.maxReach}m</span></div>
                  <div class="spec-row"><span class="spec-label">Up & Over Clearance:</span><span class="spec-val">${m.upAndOver}m</span></div>
                  <canvas id="canvas-${m.id}"></canvas>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      activeData.filter(m => m.isBoomlift).forEach(drawReachGraph);
    }

    function drawReachGraph(machine) {
      const canvas = document.getElementById(`canvas-${machine.id}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      // Handle High-DPI / Retina Crispness
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = 220 * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = 220;

      ctx.clearRect(0, 0, w, h);

      // Padding & Grid Scale Calculation
      const paddingLeft = 35;
      const paddingBottom = 28;
      const paddingTop = 15;
      const paddingRight = 15;

      const graphW = w - paddingLeft - paddingRight;
      const graphH = h - paddingTop - paddingBottom;
      const originX = paddingLeft;
      const originY = h - paddingBottom;

      const maxH = Math.max(Math.ceil((machine.maxHeight || 20) / 5) * 5, 10);
      const maxR = Math.max(Math.ceil((machine.maxReach || 12) / 2) * 2, 6);

      const scaleX = graphW / maxR;
      const scaleY = graphH / maxH;

      // 1. Draw Grid Lines & Axes Labels
      ctx.strokeStyle = '#282828';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#b0b0b0';
      ctx.font = '10px -apple-system, sans-serif';

      // X-Axis (Horizontal Reach - meters)
      const stepX = maxR > 20 ? 5 : 2;
      ctx.textAlign = 'center';
      for (let r = 0; r <= maxR; r += stepX) {
        const x = originX + r * scaleX;
        ctx.beginPath();
        ctx.moveTo(x, originY);
        ctx.lineTo(x, paddingTop);
        ctx.stroke();
        ctx.fillText(`${r}m`, x, originY + 16);
      }

      // Y-Axis (Vertical Height - meters)
      const stepY = maxH > 30 ? 10 : 5;
      ctx.textAlign = 'right';
      for (let ht = 0; ht <= maxH; ht += stepY) {
        const y = originY - ht * scaleY;
        ctx.beginPath();
        ctx.moveTo(originX, y);
        ctx.lineTo(w - paddingRight, y);
        ctx.stroke();
        ctx.fillText(`${ht}m`, originX - 6, y + 3);
      }

      // Draw Base Axes Boundaries
      ctx.strokeStyle = '#f4b000';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(originX, paddingTop);
      ctx.lineTo(originX, originY);
      ctx.lineTo(w - paddingRight, originY);
      ctx.stroke();

      // 2. Full Envelope Geometry Construction
      const H = machine.maxHeight || 0;
      const R = machine.maxReach || 0;
      const UO = machine.upAndOver || 0;

      // Key envelope boundary coordinates (m) -> Convert to Canvas Pixels
      const p0 = { x: originX, y: originY }; // Machine Base / Ground
      const p1 = { x: originX, y: originY - (UO * scaleY) }; // Up & Over Clearance Point
      const p2 = { x: originX + (R * 0.45 * scaleX), y: originY - (H * scaleY) }; // Peak Height Apex
      const p3 = { x: originX + (R * scaleX), y: originY - (H * 0.65 * scaleY) }; // Max Horizon Reach Point
      const p4 = { x: originX + (R * 0.7 * scaleX), y: originY - (H * 0.15 * scaleY) }; // Low Extension Point

      // Draw Shaded Full Envelope
      ctx.fillStyle = 'rgba(244, 176, 0, 0.25)';
      ctx.strokeStyle = '#f4b000';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);

      // Smooth curve up to Peak Height
      ctx.quadraticCurveTo(
        originX, originY - (H * scaleY),
        p2.x, p2.y
      );

      // Smooth curve to Maximum Horizontal Reach
      ctx.quadraticCurveTo(
        originX + (R * scaleX), originY - (H * 0.9 * scaleY),
        p3.x, p3.y
      );

      // Smooth curve down toward lower ground extension
      ctx.quadraticCurveTo(
        originX + (R * scaleX), originY - (H * 0.25 * scaleY),
        p4.x, p4.y
      );

      ctx.lineTo(p0.x, p0.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 3. Highlight Key Spec Points (Max Height & Max Reach)
      const drawMarker = (pt, label) => {
        ctx.fillStyle = '#f4b000';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(label, pt.x + 6, pt.y - 4);
      };

      drawMarker(p2, `Max H: ${H}m`);
      drawMarker(p3, `Max R: ${R}m`);
    }

    async function init() {
      // Clear out active Service Worker caches if any exist
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let registration of registrations) {
          await registration.unregister();
        }
      }
      await loadFleetData();
    }

    init();
  </script>
</body>
</html>
